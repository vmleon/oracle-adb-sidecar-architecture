---
# Retries handle transient /var/lib/rpm/.rpm.lock contention from
# oracle-cloud-agent plugin reconciliation (the agent was just upgraded
# by cloud-init's `dnf upgrade` and its plugins fire their own dnf
# transactions on their own schedule).
- name: Install nginx
  ansible.builtin.dnf:
    name: nginx
    update_cache: yes
  register: nginx_install
  retries: 12
  delay: 10
  until: nginx_install is success

- name: Copy frontend dist zip
  ansible.builtin.copy:
    src: files/web.zip
    dest: /home/opc/web.zip

- name: Unzip frontend dist
  ansible.builtin.command: unzip -o /home/opc/web.zip -d /usr/share/nginx/html/

- name: Render nginx config
  ansible.builtin.template:
    src: files/nginx.conf.j2
    dest: /etc/nginx/nginx.conf
  notify: restart nginx

- name: Enable nginx
  ansible.builtin.service:
    name: nginx.service
    state: started
    enabled: yes

- name: Disable firewalld
  ansible.builtin.service:
    name: firewalld
    state: stopped
    enabled: no
