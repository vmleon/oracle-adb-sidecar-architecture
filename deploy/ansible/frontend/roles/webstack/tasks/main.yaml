---
# Retries handle transient /var/lib/rpm/.rpm.lock contention from
# oracle-cloud-agent plugin reconciliation, whose plugins fire their own dnf
# transactions on their own schedule.
- name: Install nginx
  ansible.builtin.dnf:
    name: nginx
    state: present
  register: nginx_install
  retries: 12
  delay: 10
  until: nginx_install is success

- name: Install the frontend dist into the nginx root
  ansible.builtin.copy:
    src: "{{ frontend_dist }}/"
    dest: /usr/share/nginx/html/
    remote_src: true

- name: Render nginx config
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
  notify: restart nginx

- name: Enable nginx
  ansible.builtin.service:
    name: nginx.service
    state: started
    enabled: yes

- name: Open the HTTP port in firewalld
  ansible.posix.firewalld:
    port: 80/tcp
    permanent: true
    immediate: true
    state: enabled
