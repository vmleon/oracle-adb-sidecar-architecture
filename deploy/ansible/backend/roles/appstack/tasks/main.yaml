---
# Retries handle transient /var/lib/rpm/.rpm.lock contention from
# oracle-cloud-agent plugin reconciliation, whose plugins fire their own dnf
# transactions on their own schedule.
- name: Install the Java runtime
  ansible.builtin.dnf:
    name: java-25-openjdk-headless
    state: present
  register: jdk_install
  retries: 12
  delay: 10
  until: jdk_install is success

- name: Create the service account
  ansible.builtin.user:
    name: app
    system: true
    shell: /sbin/nologin

- name: Create the application directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: app
    group: app
    mode: "0750"
  loop:
    - /opt/app
    - /opt/app/config
    - /opt/app/logs

- name: Install the jar
  ansible.builtin.copy:
    src: "{{ backend_jar }}"
    dest: /opt/app/app.jar
    remote_src: true
    owner: app
    group: app
    mode: "0640"

- name: Install the ADB wallet
  ansible.builtin.copy:
    src: /home/opc/wallet/
    dest: /opt/app/wallet/
    remote_src: true
    owner: app
    group: app
    mode: "0640"
    directory_mode: "0750"

# copy applies `mode` to the destination directory too, which leaves it
# without the execute bit; put it back so the app user can read the wallet.
- name: Make the wallet directory traversable
  ansible.builtin.file:
    path: /opt/app/wallet
    state: directory
    owner: app
    group: app
    mode: "0750"

- name: Render application.yaml
  ansible.builtin.template:
    src: application.yaml.j2
    dest: /opt/app/config/application.yaml
    owner: app
    group: app
    mode: "0640"

- name: Install the systemd unit
  ansible.builtin.template:
    src: app.service.j2
    dest: /etc/systemd/system/app.service
    mode: "0644"

- name: Enable the application
  ansible.builtin.systemd:
    name: app
    enabled: true
    state: started
    daemon_reload: true

- name: Open the backend port in firewalld
  ansible.posix.firewalld:
    port: 8080/tcp
    permanent: true
    immediate: true
    state: enabled
