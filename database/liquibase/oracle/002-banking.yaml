databaseChangeLog:
  - changeSet:
      id: oracle-002-create-accounts
      author: adbsidecar
      changes:
        - createTable:
            tableName: accounts
            columns:
              - column:
                  name: id
                  type: NUMBER(10)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: customer_name
                  type: VARCHAR2(100)
                  constraints:
                    nullable: false
              - column:
                  name: balance
                  type: NUMBER(12,2)
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

  - changeSet:
      id: oracle-002-create-transactions
      author: adbsidecar
      changes:
        - sql:
            splitStatements: false
            sql: |
              CREATE BLOCKCHAIN TABLE transactions (
                id                    NUMBER(10) NOT NULL,
                account_id            NUMBER(10) NOT NULL,
                amount                NUMBER(12,2) NOT NULL,
                tx_date               TIMESTAMP DEFAULT CURRENT_TIMESTAMP NOT NULL,
                txn_type              VARCHAR2(8),
                currency              VARCHAR2(3),
                channel               VARCHAR2(8),
                merchant              VARCHAR2(80),
                merchant_country      VARCHAR2(2),
                counterparty_account  VARCHAR2(40),
                status                VARCHAR2(8),
                occurred_at           TIMESTAMP,
                CONSTRAINT pk_transactions PRIMARY KEY (id),
                CONSTRAINT fk_transactions_account FOREIGN KEY (account_id) REFERENCES accounts(id)
              )
              NO DROP UNTIL 0 DAYS IDLE
              NO DELETE UNTIL 16 DAYS AFTER INSERT
              HASHING USING "SHA2_512" VERSION "v1"

  - changeSet:
      id: oracle-002-seed-accounts
      author: adbsidecar
      changes:
        - insert:
            tableName: accounts
            columns:
              - { column: { name: id, valueNumeric: 1 } }
              - { column: { name: customer_name, value: "Alice Morgan" } }
              - { column: { name: balance, valueNumeric: 4250.75 } }
        - insert:
            tableName: accounts
            columns:
              - { column: { name: id, valueNumeric: 2 } }
              - { column: { name: customer_name, value: "Bob Chen" } }
              - { column: { name: balance, valueNumeric: 12890.10 } }
        - insert:
            tableName: accounts
            columns:
              - { column: { name: id, valueNumeric: 3 } }
              - { column: { name: customer_name, value: "Carol Diaz" } }
              - { column: { name: balance, valueNumeric: 875.00 } }

