spring:
  application:
    name: back
  main:
    banner-mode: "off"
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - com.oracle.spring.ucp.UCPAutoConfiguration
  data:
    mongodb:
      uri: mongodb://admin:CHANGEME@localhost:27017/admin
server:
  port: 8080
datasources:
  adb:
    jdbc-url: jdbc:oracle:thin:@SERVICE_high?TNS_ADMIN=/path/to/wallet
    username: ADMIN
    password: CHANGEME
  oracle:
    jdbc-url: jdbc:oracle:thin:@//localhost:1521/FREEPDB1
    username: SYSTEM
    password: CHANGEME
  postgres:
    jdbc-url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: CHANGEME
    driver-class-name: org.postgresql.Driver
selectai:
  agents:
    team: BANKING_INVESTIGATION_TEAM
    keepwarm:
      enabled: true
      interval-ms: 60000
      initial-delay-ms: 90000
management:
  endpoints:
    web:
      exposure:
        include: health,info,logfile,loggers,metrics,scheduledtasks
  endpoint:
    logfile:
      enabled: true
logging:
  file:
    name: logs/app.log
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
